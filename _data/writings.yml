# ---------------------------------------------------------------------------
# Writings — essays, translations, notes: anything that isn't a maths project.
#
# To add one:
#   1. put the file somewhere in the repo (pdf2/ is the usual spot)
#   2. copy the commented block below, uncomment it, fill it in
#   3. newest first — the page lists them in the order they appear here
#
# Each entry needs `title.en` and somewhere to point: `file` for a PDF, or
# `page` for a piece set as its own page on this site. Any language you leave
# out falls back to English, so French and Hindi can be filled in later
# without anything breaking. Drop `summary` for a bare title.
# ---------------------------------------------------------------------------

# - file: /pdf2/my-essay.pdf
#   date: 2026
#   title:
#     en: The title in English
#     fr: Le titre en français
#     hi: हिंदी में शीर्षक
#   summary:
#     en: A sentence or two about what it is.
#     fr: Une phrase ou deux pour le présenter.
#     hi: इसके बारे में एक-दो लाइनें।

- page: /writings/trail-of-the-dead.html
  title:
    en: The Trail of the Dead
